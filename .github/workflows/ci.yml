name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

defaults:
  run:
    # See https://github.com/marketplace/actions/setup-miniconda#important
    shell: bash -el {0}

jobs:
  validate:
    strategy:
      matrix:
        cppVersion: [17]

    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with: {submodules: recursive}
      - name: strip environment.yml
        run: |
          cat environment.yml | grep -v "#.*\<\local\>" > temp-ci-environment.yml
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: yardl
          environment-file: temp-ci-environment.yml
          miniforge-version: latest
      - name: Cpp
        run: |
          cd cpp && mkdir -p build && cd build
          cmake -G Ninja -S .. -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
          ninja
